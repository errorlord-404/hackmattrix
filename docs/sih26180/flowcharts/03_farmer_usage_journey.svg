<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 1080">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#0070C0"/></marker><style>.title{font:700 44px Arial;fill:#17324D}.sub{font:400 20px Arial;fill:#4B6072}.num{font:700 24px Arial;fill:#fff}.head{font:700 20px Arial;fill:#17324D}.body{font:400 15px Arial;fill:#41586A}.say{font:italic 16px Arial;fill:#166B4B}.status{font:700 13px Arial;fill:#fff}.foot{font:400 14px Arial;fill:#50677A}</style></defs>
  <rect width="1920" height="1080" fill="#F7F6F0"/><rect width="1920" height="14" fill="#0070C0"/>
  <text x="70" y="76" class="title">Farmer journey across one crop cycle</text>
  <text x="70" y="110" class="sub">The farmer can use screens or speak naturally; the agent translates intent into the same reviewable service actions</text>

  <!-- row 1 -->
  <path d="M250 345 H1680" stroke="#BCD0DD" stroke-width="10" fill="none" marker-end="url(#a)"/>
  <g>
    <rect x="70" y="170" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="115" cy="214" r="27" fill="#315A74"/><text x="115" y="222" text-anchor="middle" class="num">1</text><text x="155" y="212" class="head">Create farm memory</text><text x="96" y="256" class="body">Map the field boundary and store</text><text x="96" y="279" class="body">previous crop, area and local language.</text><text x="96" y="321" class="say">“This is my two-acre tomato field.”</text><rect x="96" y="352" width="152" height="28" rx="14" fill="#3E8D66"/><text x="172" y="371" text-anchor="middle" class="status">IMPLEMENTED</text>
    <rect x="405" y="170" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="450" cy="214" r="27" fill="#315A74"/><text x="450" y="222" text-anchor="middle" class="num">2</text><text x="490" y="212" class="head">Measure soil baseline</text><text x="431" y="256" class="body">Combine soil test with moisture,</text><text x="431" y="279" class="body">temperature, pH, EC and NPK trends.</text><text x="431" y="321" class="say">“Is this reading fresh and reliable?”</text><rect x="431" y="352" width="214" height="28" rx="14" fill="#B7791F"/><text x="538" y="371" text-anchor="middle" class="status">HARDWARE VALIDATION</text>
    <rect x="740" y="170" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="785" cy="214" r="27" fill="#315A74"/><text x="785" y="222" text-anchor="middle" class="num">3</text><text x="825" y="212" class="head">Compare crop choices</text><text x="766" y="256" class="body">Rank suitable crops using soil, rotation,</text><text x="766" y="279" class="body">season, weather and market evidence.</text><text x="766" y="321" class="say">“Show profit and risk trade-offs.”</text><rect x="766" y="352" width="152" height="28" rx="14" fill="#3E8D66"/><text x="842" y="371" text-anchor="middle" class="status">IMPLEMENTED</text>
    <rect x="1075" y="170" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="1120" cy="214" r="27" fill="#315A74"/><text x="1120" y="222" text-anchor="middle" class="num">4</text><text x="1160" y="212" class="head">Source inputs</text><text x="1101" y="256" class="body">Find seeds, fertilizer, machinery and</text><text x="1101" y="279" class="body">labour; compare disclosed landed cost.</text><text x="1101" y="321" class="say">“Which tractor quote costs less here?”</text><rect x="1101" y="352" width="152" height="28" rx="14" fill="#3E8D66"/><text x="1177" y="371" text-anchor="middle" class="status">IMPLEMENTED</text>
    <rect x="1410" y="170" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="1455" cy="214" r="27" fill="#315A74"/><text x="1455" y="222" text-anchor="middle" class="num">5</text><text x="1495" y="212" class="head">Run crop calendar</text><text x="1436" y="256" class="body">Create tasks for sowing, germination,</text><text x="1436" y="279" class="body">growth, flowering and maturity.</text><text x="1436" y="321" class="say">“What should I do this week?”</text><rect x="1436" y="352" width="152" height="28" rx="14" fill="#3E8D66"/><text x="1512" y="371" text-anchor="middle" class="status">IMPLEMENTED</text>
  </g>

  <!-- turn -->
  <path d="M1710 345 C1800 345 1800 515 1710 515" stroke="#0070C0" stroke-width="5" fill="none" marker-end="url(#a)"/>

  <!-- row 2 reverse -->
  <path d="M1680 780 H250" stroke="#BCD0DD" stroke-width="10" fill="none" marker-end="url(#a)"/>
  <g>
    <rect x="1410" y="520" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="1455" cy="564" r="27" fill="#315A74"/><text x="1455" y="572" text-anchor="middle" class="num">6</text><text x="1495" y="562" class="head">Monitor crop health</text><text x="1436" y="606" class="body">Check images, symptoms, weather and</text><text x="1436" y="629" class="body">crop stage; abstain when uncertain.</text><text x="1436" y="671" class="say">“Is this leaf problem supported?”</text><rect x="1436" y="702" width="190" height="28" rx="14" fill="#B7791F"/><text x="1531" y="721" text-anchor="middle" class="status">DEMO MODEL ONLY</text>
    <rect x="1075" y="520" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="1120" cy="564" r="27" fill="#315A74"/><text x="1120" y="572" text-anchor="middle" class="num">7</text><text x="1160" y="562" class="head">Plan irrigation and risk</text><text x="1101" y="606" class="body">Use moisture freshness, crop stage and</text><text x="1101" y="629" class="body">rain forecast to advise or defer water.</text><text x="1101" y="671" class="say">“Rain is due. Should I irrigate?”</text><rect x="1101" y="702" width="240" height="28" rx="14" fill="#B7791F"/><text x="1221" y="721" text-anchor="middle" class="status">ADVICE LIVE · PUMP GATED</text>
    <rect x="740" y="520" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="785" cy="564" r="27" fill="#315A74"/><text x="785" y="572" text-anchor="middle" class="num">8</text><text x="825" y="562" class="head">Prepare harvest</text><text x="766" y="606" class="body">Review stage, weather, machinery, labour</text><text x="766" y="629" class="body">and logistics before fixing the date.</text><text x="766" y="671" class="say">“Can I harvest before the storm?”</text><rect x="766" y="702" width="178" height="28" rx="14" fill="#3E8D66"/><text x="855" y="721" text-anchor="middle" class="status">PARTLY IMPLEMENTED</text>
    <rect x="405" y="520" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="450" cy="564" r="27" fill="#315A74"/><text x="450" y="572" text-anchor="middle" class="num">9</text><text x="490" y="562" class="head">Choose market action</text><text x="431" y="606" class="body">Compare mandi revenue minus transport,</text><text x="431" y="629" class="body">MSP context and explicit quote costs.</text><text x="431" y="671" class="say">“Which mandi gives the best net return?”</text><rect x="431" y="702" width="152" height="28" rx="14" fill="#3E8D66"/><text x="507" y="721" text-anchor="middle" class="status">IMPLEMENTED</text>
    <rect x="70" y="520" width="300" height="245" rx="18" fill="#fff" stroke="#9DB0BF" stroke-width="2"/><circle cx="115" cy="564" r="27" fill="#315A74"/><text x="115" y="572" text-anchor="middle" class="num">10</text><text x="155" y="562" class="head">Close and learn</text><text x="96" y="606" class="body">Record income, expenses, outcome and</text><text x="96" y="629" class="body">loss evidence; improve the next cycle.</text><text x="96" y="671" class="say">“What did this crop earn after costs?”</text><rect x="96" y="702" width="152" height="28" rx="14" fill="#3E8D66"/><text x="172" y="721" text-anchor="middle" class="status">IMPLEMENTED</text>
  </g>

  <path d="M220 780 C115 780 115 905 250 905 H1650" stroke="#0070C0" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <rect x="400" y="850" width="1120" height="110" rx="55" fill="#12372A"/>
  <text x="960" y="895" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Persistent learning loop</text>
  <text x="960" y="928" text-anchor="middle" fill="#DCEFE6" font-family="Arial" font-size="17">Every observation, task, diagnosis, purchase and sale strengthens the next crop decision</text>
  <text x="70" y="1022" class="foot">Interaction rule: the farmer confirms consequential writes. The agent never turns an uncertain model output into fertilizer, pesticide or pump control.</text>
</svg>
