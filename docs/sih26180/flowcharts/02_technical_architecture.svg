<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5D7385"/></marker>
    <style>.title{font:700 44px Arial;fill:#17324D}.sub{font:400 20px Arial;fill:#4B6072}.lane{font:700 18px Arial;fill:#fff}.head{font:700 20px Arial;fill:#17324D}.body{font:400 15px Arial;fill:#405568}.tech{font:700 14px Arial;fill:#166B4B}.white{fill:#fff}.small{font:400 13px Arial;fill:#50677A}</style>
  </defs>
  <rect width="1920" height="1080" fill="#F7F6F0"/><rect width="1920" height="14" fill="#0070C0"/>
  <text x="70" y="76" class="title">KisanSathi technical architecture</text>
  <text x="70" y="110" class="sub">The web app, voice agent and Codex harness share one FastAPI domain layer and one persistent farm record</text>

  <!-- actors and channels -->
  <rect x="70" y="150" width="1780" height="105" rx="14" fill="#E7EEF5" stroke="#9DB0BF"/>
  <rect x="70" y="150" width="170" height="105" rx="14" fill="#315A74"/><text x="155" y="190" text-anchor="middle" class="lane">FARMER</text><text x="155" y="219" text-anchor="middle" class="white" font-family="Arial" font-size="14">voice, photo, map</text><text x="155" y="239" text-anchor="middle" class="white" font-family="Arial" font-size="14">and confirmations</text>
  <rect x="285" y="171" width="280" height="64" rx="10" fill="#fff" stroke="#8CA6BA"/><text x="425" y="198" text-anchor="middle" class="head">React farmer app</text><text x="425" y="221" text-anchor="middle" class="tech">React 19 · Vite · Tailwind · Leaflet</text>
  <rect x="610" y="171" width="280" height="64" rx="10" fill="#fff" stroke="#8CA6BA"/><text x="750" y="198" text-anchor="middle" class="head">Voice assistant</text><text x="750" y="221" text-anchor="middle" class="tech">Sarvam STT · translation · TTS</text>
  <rect x="935" y="171" width="320" height="64" rx="10" fill="#fff" stroke="#8CA6BA"/><text x="1095" y="198" text-anchor="middle" class="head">Codex desktop harness</text><text x="1095" y="221" text-anchor="middle" class="tech">Electron · Codex app-server</text>
  <rect x="1300" y="171" width="500" height="64" rx="10" fill="#fff" stroke="#8CA6BA"/><text x="1550" y="198" text-anchor="middle" class="head">KisanSathi MCP tools</text><text x="1550" y="221" text-anchor="middle" class="tech">Python · FastMCP · httpx · typed tool results</text>

  <!-- orchestration -->
  <rect x="70" y="292" width="1780" height="108" rx="14" fill="#DCEFE6" stroke="#6DA58A"/>
  <rect x="70" y="292" width="170" height="108" rx="14" fill="#166B4B"/><text x="155" y="332" text-anchor="middle" class="lane">ORCHESTRATION</text><text x="155" y="360" text-anchor="middle" class="white" font-family="Arial" font-size="14">context and safe</text><text x="155" y="380" text-anchor="middle" class="white" font-family="Arial" font-size="14">tool execution</text>
  <text x="285" y="325" class="head">Agent decision loop</text><text x="285" y="352" class="body">Understand intent · fetch farm context · invoke a typed service · explain evidence · request confirmation for writes</text>
  <text x="285" y="381" class="tech">Agnostic interface: any approved AI model can operate the same MCP contract</text>
  <rect x="1470" y="312" width="330" height="68" rx="10" fill="#12372A"/><text x="1635" y="340" text-anchor="middle" class="lane">Authority boundary</text><text x="1635" y="365" text-anchor="middle" class="white" font-family="Arial" font-size="14">Agent explains; services calculate and persist</text>

  <!-- FastAPI services -->
  <rect x="70" y="438" width="1780" height="210" rx="14" fill="#F2F6F8" stroke="#AAB9C4"/>
  <rect x="70" y="438" width="170" height="210" rx="14" fill="#0070C0"/><text x="155" y="478" text-anchor="middle" class="lane">DOMAIN API</text><text x="155" y="506" text-anchor="middle" class="white" font-family="Arial" font-size="14">FastAPI · Pydantic</text><text x="155" y="526" text-anchor="middle" class="white" font-family="Arial" font-size="14">Python 3.11+</text>
  <g>
    <rect x="280" y="468" width="260" height="70" rx="10" fill="#fff" stroke="#7F9CB2"/><text x="410" y="496" text-anchor="middle" class="head">Farm state</text><text x="410" y="520" text-anchor="middle" class="body">fields · GPS · crop stages · tasks</text>
    <rect x="565" y="468" width="260" height="70" rx="10" fill="#fff" stroke="#7F9CB2"/><text x="695" y="496" text-anchor="middle" class="head">Soil and irrigation</text><text x="695" y="520" text-anchor="middle" class="body">tests · telemetry · weather rules</text>
    <rect x="850" y="468" width="260" height="70" rx="10" fill="#fff" stroke="#7F9CB2"/><text x="980" y="496" text-anchor="middle" class="head">Crop health</text><text x="980" y="520" text-anchor="middle" class="body">photo contract · model provenance</text>
    <rect x="1135" y="468" width="260" height="70" rx="10" fill="#fff" stroke="#7F9CB2"/><text x="1265" y="496" text-anchor="middle" class="head">Market and inputs</text><text x="1265" y="520" text-anchor="middle" class="body">mandi · MSP · suppliers · quotes</text>
    <rect x="1420" y="468" width="350" height="70" rx="10" fill="#fff" stroke="#7F9CB2"/><text x="1595" y="496" text-anchor="middle" class="head">Finance, reports and schemes</text><text x="1595" y="520" text-anchor="middle" class="body">ledger · eligibility · evidence pack</text>
    <rect x="280" y="558" width="1490" height="62" rx="10" fill="#E7EEF5"/><text x="1025" y="584" text-anchor="middle" class="head">Shared API policies</text><text x="1025" y="608" text-anchor="middle" class="body">authentication · idempotency · source attribution · freshness · unknown states · audit trail</text>
  </g>

  <!-- data and providers -->
  <rect x="70" y="686" width="860" height="250" rx="14" fill="#FFF9E9" stroke="#D2B26E"/>
  <rect x="70" y="686" width="170" height="250" rx="14" fill="#B7791F"/><text x="155" y="726" text-anchor="middle" class="lane">DATA</text><text x="155" y="754" text-anchor="middle" class="white" font-family="Arial" font-size="14">local continuity +</text><text x="155" y="774" text-anchor="middle" class="white" font-family="Arial" font-size="14">shared reference data</text>
  <rect x="280" y="716" width="285" height="88" rx="10" fill="#fff" stroke="#C9A451"/><text x="423" y="747" text-anchor="middle" class="head">Per-farmer SQLite</text><text x="423" y="773" text-anchor="middle" class="body">profile, fields, stages, telemetry,</text><text x="423" y="793" text-anchor="middle" class="body">tasks, ledger, diagnoses, reports</text>
  <rect x="595" y="716" width="285" height="88" rx="10" fill="#fff" stroke="#C9A451"/><text x="738" y="747" text-anchor="middle" class="head">MongoDB reference store</text><text x="738" y="773" text-anchor="middle" class="body">crops, diseases, seeds, fertilizer,</text><text x="738" y="793" text-anchor="middle" class="body">prices, MSP, schemes, directories</text>
  <rect x="280" y="828" width="600" height="78" rx="10" fill="#FFF0C7"/><text x="580" y="858" text-anchor="middle" class="head">Store-and-forward pattern</text><text x="580" y="884" text-anchor="middle" class="body">Farmer history remains available; provider data refreshes when connectivity returns</text>

  <rect x="970" y="686" width="880" height="250" rx="14" fill="#EEF5FA" stroke="#8CA6BA"/>
  <rect x="970" y="686" width="170" height="250" rx="14" fill="#315A74"/><text x="1055" y="726" text-anchor="middle" class="lane">EDGE + CLOUD</text><text x="1055" y="754" text-anchor="middle" class="white" font-family="Arial" font-size="14">sensing, models</text><text x="1055" y="774" text-anchor="middle" class="white" font-family="Arial" font-size="14">and public data</text>
  <rect x="1180" y="716" width="295" height="88" rx="10" fill="#fff" stroke="#7F9CB2"/><text x="1328" y="747" text-anchor="middle" class="head">Field node</text><text x="1328" y="773" text-anchor="middle" class="body">ESP32-S3 · RS485/Modbus ·</text><text x="1328" y="793" text-anchor="middle" class="body">SEN0604 + SEN0605 · queued upload</text>
  <rect x="1500" y="716" width="300" height="88" rx="10" fill="#fff" stroke="#7F9CB2"/><text x="1650" y="747" text-anchor="middle" class="head">Vision runtime</text><text x="1650" y="773" text-anchor="middle" class="body">TF Hub training · TFLite candidate ·</text><text x="1650" y="793" text-anchor="middle" class="body">Qualcomm AI Hub profiling planned</text>
  <rect x="1180" y="828" width="620" height="78" rx="10" fill="#DCEAF4"/><text x="1490" y="858" text-anchor="middle" class="head">External evidence providers</text><text x="1490" y="884" text-anchor="middle" class="body">Open-Meteo · AGMARKNET/data.gov.in · PIB/MSP · APEDA · approved directories</text>

  <!-- connectors -->
  <g stroke="#5D7385" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M960 255 V286"/><path d="M960 400 V432"/><path d="M620 648 V680"/><path d="M1410 648 V680"/></g>
  <rect x="70" y="972" width="1780" height="70" rx="12" fill="#17324D"/>
  <text x="100" y="999" class="white" font-family="Arial" font-size="14" font-weight="700">DEPLOYMENT TRUTH</text><text x="100" y="1024" class="white" font-family="Arial" font-size="14">Live software prototype: app + API + SQLite/Mongo + MCP tools. Field validation pending: firmware export, sensor calibration, target-device ML benchmark and safe pump controller.</text>
</svg>
