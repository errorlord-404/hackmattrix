server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness is local to the web process and never depends on provider state.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"web"}';
    }

    # Readiness proves that the reverse-proxy path can reach a ready API.
    location = /readyz {
        proxy_pass http://api:8000/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header Cache-Control "no-store";
    }

    # The browser talks same-origin; provider credentials remain in api.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # The harness is a separate provider-neutral service. Keep its SSE path
    # same-origin and disable buffering so event IDs/reconnects remain intact.
    location /harness/ {
        proxy_pass http://harness:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Accept "text/event-stream";
        add_header X-Accel-Buffering no;
    }

    # Client-side routes must resolve to the SPA entrypoint.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
