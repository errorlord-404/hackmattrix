[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisansathi-auth"
version = "1.0.0"
description = "Shared Kisan Sathi OIDC, session, CSRF, and actor-scope contract"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyJWT==2.14.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
