[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisansathi-standalone-api"
version = "1.0.0"
description = "Standalone Kisan Sathi domain and reference API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "PyJWT==2.14.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "beanie==2.0.0",
  "motor==3.7.1",
  "pymongo==4.17.0",
  "python-dotenv==1.2.2",
  "PyYAML==6.0.3",
  "uvicorn==0.52.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
