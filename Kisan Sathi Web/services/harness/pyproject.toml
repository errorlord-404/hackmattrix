[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisansathi-standalone-harness"
version = "1.0.0"
description = "Provider-neutral authenticated Kisan Sathi web harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "PyJWT==2.14.0",
  "PyYAML==6.0.3",
  "uvicorn==0.52.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/auth", "../../packages/tool-registry"]
testpaths = ["tests"]
